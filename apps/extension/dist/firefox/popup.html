<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Save to Keepsake</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 360px;
      max-height: 600px;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0c0c0e;
      color: #f4f4f5;
      font-size: 13px;
    }
    .header {
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #27272a;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 14px;
      color: #38bdf8;
    }
    .brand svg { width: 16px; height: 16px; fill: currentColor; }
    .status-badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 999px;
      background: #27272a;
      color: #a1a1aa;
    }
    .status-badge.saved {
      background: #064e3b;
      color: #34d399;
    }
    .content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-preview {
      background: #18181b;
      border-radius: 10px;
      padding: 10px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      border: 1px solid #27272a;
    }
    .cover-thumb {
      width: 60px;
      height: 60px;
      border-radius: 6px;
      object-fit: cover;
      background: #27272a;
      flex-shrink: 0;
      display: none;
    }
    .meta-box {
      flex: 1;
      overflow: hidden;
    }
    .domain-row {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #a1a1aa;
      margin-bottom: 4px;
    }
    .domain-favicon {
      width: 14px;
      height: 14px;
      border-radius: 2px;
    }
    .page-title {
      font-size: 12px;
      font-weight: 600;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    label {
      font-size: 11px;
      font-weight: 600;
      color: #a1a1aa;
      margin-bottom: 4px;
      display: block;
    }
    input, select, textarea {
      width: 100%;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 8px;
      padding: 8px 10px;
      color: #f4f4f5;
      font-size: 12px;
      outline: none;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      border-color: #38bdf8;
    }
    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 6px;
    }
    .tag-chip {
      background: #0284c7;
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .tag-chip span { cursor: pointer; }
    .row-split {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .row-split > div { flex: 1; }
    .collection-controls { display: flex; gap: 6px; }
    .collection-controls select { flex: 1; min-width: 0; }
    .collection-add { flex-shrink: 0; background: #27272a; color: #e4e4e7; border: 1px solid #3f3f46; border-radius: 8px; padding: 0 10px; font-size: 18px; cursor: pointer; }
    .collection-add:disabled, .btn:disabled { opacity: .5; cursor: default; }
    #collectionCreate { display: none; margin-top: 8px; }
    #collectionCreate.open { display: block; }
    .collection-actions { display: flex; gap: 6px; margin-top: 6px; }
    .collection-cancel { background: #27272a; color: #e4e4e7; }
    #collectionMessage { margin-top: 6px; color: #fbbf24; font-size: 11px; }
    .star-btn {
      background: #18181b;
      border: 1px solid #27272a;
      padding: 7px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #a1a1aa;
      margin-top: 18px;
    }
    .star-btn.active {
      color: #facc15;
      border-color: #facc15;
      background: rgba(250, 204, 21, 0.1);
    }
    .footer {
      padding: 12px 16px;
      border-top: 1px solid #27272a;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #0284c7;
      color: #fff;
      box-shadow: 0 2px 10px rgba(2, 132, 199, 0.3);
    }
    .btn-primary:hover {
      background: #0369a1;
    }
    .btn-danger {
      background: transparent;
      color: #f87171;
    }
    .btn-danger:hover {
      background: rgba(248, 113, 113, 0.1);
    }
    .settings-link {
      font-size: 11px;
      color: #71717a;
      text-decoration: none;
      cursor: pointer;
    }
    .settings-link:hover { color: #a1a1aa; }
    #settingsPanel {
      display: none;
      padding: 16px;
      border-top: 1px solid #27272a;
    }
  </style>
  <script type="module" crossorigin src="/popup.js"></script>
</head>
<body>
  <div class="header">
    <div class="brand">
      <svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
      <span>Keepsake</span>
    </div>
    <span id="statusBadge" class="status-badge">Checking...</span>
  </div>

  <div class="content">
    <!-- Preview Box -->
    <div class="card-preview">
      <img id="coverImg" class="cover-thumb" alt="" />
      <div class="meta-box">
        <div class="domain-row">
          <img id="faviconImg" class="domain-favicon" alt="" />
          <span id="domainLabel">domain.com</span>
        </div>
        <div id="pageTitle" class="page-title">Loading current tab...</div>
      </div>
    </div>

    <!-- Collection & Star -->
    <div class="row-split">
      <div>
        <label for="collectionSelect">Collection</label>
        <div class="collection-controls">
          <select id="collectionSelect">
            <option value="unsorted">📥 Unsorted</option>
          </select>
          <button type="button" id="openCollectionCreate" class="collection-add" aria-label="Create collection" aria-expanded="false" aria-controls="collectionCreate" disabled>+</button>
        </div>
        <div id="collectionCreate">
          <label for="collectionName">New collection name</label>
          <input id="collectionName" type="text" maxlength="120" placeholder="Collection name" />
          <label for="collectionParent" style="margin-top: 8px;">Parent collection</label>
          <select id="collectionParent"><option value="">None (top level)</option></select>
          <div class="collection-actions">
            <button type="button" id="createCollectionBtn" class="btn btn-primary">Create</button>
            <button type="button" id="cancelCollectionBtn" class="btn collection-cancel">Cancel</button>
          </div>
        </div>
        <div id="collectionMessage" role="status" aria-live="polite"></div>
      </div>
      <div>
        <button type="button" id="starBtn" class="star-btn">
          ★ <span>Favorite</span>
        </button>
      </div>
    </div>

    <!-- Tags -->
    <div>
      <label for="tagInput">Tags (Press Enter or Comma)</label>
      <input type="text" id="tagInput" placeholder="reading, dev, design" />
      <div id="tagsContainer" class="tags-container"></div>
    </div>

    <!-- Note -->
    <div>
      <label for="noteInput">Personal Note (Markdown)</label>
      <textarea id="noteInput" rows="2" placeholder="Notes, highlights, or quotes..."></textarea>
    </div>
  </div>

  <div class="footer">
    <button type="button" id="deleteBtn" class="btn btn-danger" style="display:none;">Remove</button>
    <a id="toggleSettings" class="settings-link">⚙ Server Settings</a>
    <button type="button" id="saveBtn" class="btn btn-primary">Save to Keepsake</button>
  </div>

  <!-- Settings Expandable -->
  <div id="settingsPanel">
    <label for="serverUrlInput">Keepsake Server API URL</label>
    <input type="text" id="serverUrlInput" placeholder="http://your-ubuntu-server:3000" style="margin-bottom: 8px;" />
    <label for="apiTokenInput">Server API token</label>
    <input type="password" id="apiTokenInput" autocomplete="off" placeholder="Token from server configuration" style="margin-bottom: 8px;" />
    <button type="button" id="saveSettingsBtn" class="btn btn-primary" style="width:100%;">Save Settings</button>
  </div>

</body>
</html>
