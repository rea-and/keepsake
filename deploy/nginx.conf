# Keepsake Nginx Reverse Proxy Configuration for Ubuntu Server
# Place in /etc/nginx/sites-available/keepsake and symlink to /etc/nginx/sites-enabled/
#
# Google only accepts https:// redirect URIs for anything but localhost, so Keepsake must be served
# over HTTPS. Get a certificate with:  sudo certbot --nginx -d keepsake.yourdomain.com
# (certbot fills in the ssl_certificate lines below). Then set in the server's .env:
#   GOOGLE_REDIRECT_URI=https://keepsake.yourdomain.com/api/auth/google/callback

server {
    listen 80;
    server_name keepsake.yourdomain.com; # Replace with your domain

    # Send everything to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name keepsake.yourdomain.com; # Replace with your domain

    ssl_certificate     /etc/letsencrypt/live/keepsake.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keepsake.yourdomain.com/privkey.pem;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Keepsake uses this to build the sign-in redirect and to set the Secure cookie flag
        proxy_set_header X-Forwarded-Proto https;
    }
}
